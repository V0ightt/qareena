<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}قرينة{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="top">
    <a class="brand" href="{% block home %}/{% endblock %}">قرينة <span>Qareena</span></a>
    {% block nav %}{% endblock %}
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="foot">{% block foot %}وثائق تجريبية فقط · لا تُرفع وثائق حقيقية{% endblock %}</footer>
</body>
</html>
