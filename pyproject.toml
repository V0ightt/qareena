[project]
name = "qareena"
version = "0.1.0"
description = "Local-first KYC document agent: reads Arabic document photos, cross-checks them, and routes exceptions to a human with evidence."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Momen Saeb" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qareena"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text in strings/comments is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
