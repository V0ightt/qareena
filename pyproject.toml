[project]
name = "qareena"
version = "0.1.0"
description = "Local-first KYC document agent: reads Arabic document photos, cross-checks them, and routes exceptions to a human with evidence."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Momen Saeb" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    "pillow>=12.3",
    "opencv-python-headless>=4.10",
    "rapidocr[rtl]>=3.10",
    "onnxruntime>=1.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "cryptography>=44",
    "jinja2>=3.1",
]

[project.scripts]
qareena = "qareena.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
]
synth = [
    "playwright>=1.48",
]

[tool.uv]
# synth (templates' renderer driver) is needed by the dataset tools and their tests: keep it
# installed, or every plain `uv run` would uninstall it again
default-groups = ["dev", "synth"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qareena"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text in strings/comments is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # assert is how pytest works; seeded test data
"src/qareena/synth/**" = ["S311"]  # seeded pseudo-random synthetic data, not cryptography
"tools/**" = ["S311", "E501"]  # report table templates

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
